name: Release OMNIX (signed)

# Release-пайплайн подписанного релиза (P0-1).
#
# Запускается ТОЛЬКО вручную (workflow_dispatch) с явным выбором окружения.
# Требует secrets (см. docs/RELEASE.md):
#   OMNIX_RELEASE_KEYSTORE_B64     — base64 от release-keystore (.jks)
#   OMNIX_SIGNING_STORE_PASSWORD   — пароль keystore
#   OMNIX_SIGNING_KEY_ALIAS        — alias ключа
#   OMNIX_SIGNING_KEY_PASSWORD     — пароль ключа
# Переходный фолбэк: пока OMNIX_*-секреты не заведены, читаются legacy
# JARVIS_*-секреты (их значения недоступны через API, поэтому молчаливый
# переезд невозможен — пайплайн поддерживает оба имени).
#
# Гарантии:
#  - prodRelease собирается ТОЛЬКО подписанным (OMNIX_REQUIRE_SIGNED_RELEASE=true
#    проваливает сборку без secrets вместо тихой unsigned-сборки);
#  - подпись проверяется apksigner после сборки (verify + print-certs);
#  - артефакты (AAB + APK) выгружаются с retention 90 дней.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Release environment"
        type: choice
        options:
          - staging
          - prod
        default: staging
        required: true
      api_url:
        description: "Staging API base URL (staging only; must be https)"
        type: string
        default: https://omnix.144.31.14.236.sslip.io
        required: false

permissions:
  contents: read

jobs:
  signed-release:
    name: "Signed release (${{ inputs.environment }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Least privilege: только эта job публикует OTA-релиз (gh release
    # create/upload/edit), workflow в целом остаётся read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'

      - name: Fail fast if signing secrets are absent
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.OMNIX_RELEASE_KEYSTORE_B64 != '' || secrets.JARVIS_RELEASE_KEYSTORE_B64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.OMNIX_SIGNING_STORE_PASSWORD != '' || secrets.JARVIS_SIGNING_STORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.OMNIX_SIGNING_KEY_ALIAS != '' || secrets.JARVIS_SIGNING_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.OMNIX_SIGNING_KEY_PASSWORD != '' || secrets.JARVIS_SIGNING_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=()
          [[ "$HAS_KEYSTORE" == "true" ]] || missing+=(OMNIX_RELEASE_KEYSTORE_B64)
          [[ "$HAS_STORE_PASSWORD" == "true" ]] || missing+=(OMNIX_SIGNING_STORE_PASSWORD)
          [[ "$HAS_KEY_ALIAS" == "true" ]] || missing+=(OMNIX_SIGNING_KEY_ALIAS)
          [[ "$HAS_KEY_PASSWORD" == "true" ]] || missing+=(OMNIX_SIGNING_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Отсутствуют secrets: ${missing[*]}. См. docs/RELEASE.md."
            exit 1
          fi

      - name: Restore keystore and signing properties
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          echo "${{ secrets.OMNIX_RELEASE_KEYSTORE_B64 != '' && secrets.OMNIX_RELEASE_KEYSTORE_B64 || secrets.JARVIS_RELEASE_KEYSTORE_B64 }}" | base64 -d > signing/omnix-release.jks
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/signing/omnix-release.jks
          storePassword=${{ secrets.OMNIX_SIGNING_STORE_PASSWORD != '' && secrets.OMNIX_SIGNING_STORE_PASSWORD || secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.OMNIX_SIGNING_KEY_ALIAS != '' && secrets.OMNIX_SIGNING_KEY_ALIAS || secrets.JARVIS_SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.OMNIX_SIGNING_KEY_PASSWORD != '' && secrets.OMNIX_SIGNING_KEY_PASSWORD || secrets.JARVIS_SIGNING_KEY_PASSWORD }}
          EOF

      - name: Verify dependency locks and checksums
        shell: bash
        run: |
          bash ./gradlew :app:dependencies --write-locks --no-daemon
          git diff --exit-code -- '**/gradle.lockfile' 'gradle/verification-metadata.xml'

      - name: Build signed ${{ inputs.environment }} release
        shell: bash
        env:
          OMNIX_REQUIRE_SIGNED_RELEASE: 'true'
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            bash ./gradlew :app:bundleProdRelease :app:assembleProdRelease \
              -POMNIX_VERSION_CODE="${{ github.run_number }}" \
              --stacktrace --no-daemon
          else
            API_URL="${{ inputs.api_url }}"
            case "$API_URL" in
              https://*) ;;
              *) echo "::error::staging api_url must be https, got: $API_URL"; exit 1 ;;
            esac
            bash ./gradlew :app:bundleStagingRelease :app:assembleStagingRelease \
              -POMNIX_STAGING_API_BASE_URL="$API_URL" \
              -POMNIX_VERSION_CODE="${{ github.run_number }}" \
              --stacktrace --no-daemon
          fi

      - name: Verify signature (apksigner)
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::release APK не найден"; exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          echo "Signed APK verified: $APK"

      - name: Verify localmodel asset pack inside AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find app/build/outputs/bundle -name '*.aab' | head -n 1)
          [ -n "$AAB" ] || { echo "::error::AAB не собран"; exit 1; }
          unzip -l "$AAB" | grep -q 'localmodel/' \
            || { echo "::error::install-time пак localmodel отсутствует в AAB"; exit 1; }
          echo "PAD OK: localmodel pack present in $AAB"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OMNIX-${{ inputs.environment }}-release-${{ github.sha }}
          path: |
            app/build/outputs/bundle/*Release/*.aab
            app/build/outputs/apk/*/**/*release*.apk
          if-no-files-found: error
          retention-days: 90

      # OTA-канал: подписанные staging/prod APK проверяют /v1/app/latest.
      # Релизный tag и asset соответствуют flavor, а заметки несут versionCode
      # (== run_number) и sha — их парсит AppUpdateHttpHandler. Stable tags are
      # intentionally rolling: the client only accepts a strictly higher code.
      - name: Publish direct-install APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_CHANNEL: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$OTA_CHANNEL" in
            staging|prod) ;;
            *) echo "::error::неизвестный OTA-канал: $OTA_CHANNEL"; exit 1 ;;
          esac
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::release APK не найден"; exit 1; }
          ASSET="OMNIX-${OTA_CHANNEL}.apk"
          cp "$APK" "$ASSET"
          if ! gh release view "$OTA_CHANNEL" >/dev/null 2>&1; then
            gh release create "$OTA_CHANNEL" --target "${{ github.sha }}" \
              --title "OMNIX ${OTA_CHANNEL} (latest)" \
              --notes "Rolling signed build for in-app updates."
          fi
          gh release upload "$OTA_CHANNEL" "$ASSET" --clobber
          # printf вместо многострочной строки: YAML-индентация не должна
          # попадать в заметки (парсер сервера ждёт ключи с начала строки).
          NOTES="$(printf 'versionCode=%s\nsha=%s' \
            "${{ github.run_number }}" "${{ github.sha }}")"
          gh release edit "$OTA_CHANNEL" --notes "$NOTES"

      - name: Cleanup signing material
        if: ${{ always() }}
        shell: bash
        run: rm -rf signing keystore.properties
