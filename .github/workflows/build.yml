name: Build OMNIX APK

permissions:
  contents: read

on:
  push:
    # Только main: на feature-ветках push-прогон дублирует pull_request-прогон
    # того же SHA (required-чеки приходят из pull_request-прогонов).
    # Docs-only коммиты в main не гоняют полный пайплайн (~7 мин × 2 воркфлоу).
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    # НАМЕРЕННО без paths/branches-фильтров: все 5 required status checks
    # (branch protection) обязаны прийти на каждый PR — если воркфлоу
    # отфильтруется, чек останется "expected" и мерж зависнет навсегда.
    # Экономим на push-прогонах, а не на PR-ах.
  workflow_dispatch:

# Новый пуш в тот же PR/ветку гасит устаревший прогон ЭТОГО воркфлоу —
# экономия минут Actions (полный прогон ~7 мин × 2 job с Postgres).
# github.workflow в группе — воркфлоу не гасят друг друга;
# event_name — schedule/workflow_dispatch-прогоны не отменяются пушами
# (еженедельный security-скан нельзя молча гасить коммитом);
# github.ref — группа per-PR/per-ветка. Публикации не затронуты:
# у release.yml своя группа ota-staging-release без cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C-01 gate: обязательная быстрая проверка, что оба модуля КОМПИЛИРУЮТСЯ.
  # Запускается ПЕРВЫМ и без Postgres/Android-эмулятора, чтобы любая P0
  # сборко-ломающая правка (как Main.kt shutdown hook с невидимыми локалами)
  # фейпила CI за ~2 минуты, а не через 20 минут после всех тестов/сборок.
  # Branch-protection должен помечать этот job как required.
  compileKotlin:
    name: "compile-gate (server + app debug)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ТОЛЬКО компиляция, без тестов, без lint, без детект, без Docker.
      # :server:compileKotlin   — JVM-сервер
      # :app:compileDevDebugKotlin — Android debug (compileDebugKotlin-variant с flavor dev)
      # Compile failure = red job = PR blocked.
      - name: Compile all production Kotlin
        shell: bash
        run: |
          bash ./gradlew \
            :server:compileKotlin \
            :app:compileDevDebugKotlin \
            --stacktrace --no-daemon

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        # PostgreSQL 17.10 Bookworm — immutable multi-arch manifest digest.
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix_test
          POSTGRES_PASSWORD: omnix_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix_test -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OMNIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/omnix_test
      OMNIX_TEST_DATABASE_USER: omnix_test
      OMNIX_TEST_DATABASE_PASSWORD: omnix_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify dependency locks and checksums
        shell: bash
        run: |
          bash ./gradlew :app:dependencies :server:dependencies --write-locks --no-daemon
          git diff --exit-code -- '**/gradle.lockfile' 'gradle/verification-metadata.xml'

      - name: Test Android dev and verify JVM coverage
        shell: bash
        run: |
          bash ./gradlew :app:jacocoDevDebugCoverageVerification \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      - name: Run Android and server static analysis
        shell: bash
        run: |
          bash ./gradlew phase3StaticAnalysis \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      - name: Lint Android dev
        shell: bash
        run: bash ./scripts/run-ci-android-lint.sh

      - name: Architectural invariants (H-02..H-06/M-01/M-02/M-10)
        shell: bash
        run: bash ./scripts/verify-architectural-invariants.sh

      - name: Build Android dev app and instrumentation APKs
        shell: bash
        run: |
          bash ./gradlew :app:assembleDevDebug :app:assembleDevDebugAndroidTest \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      # R8/ProGuard-смоук: minifyEnabled release-вариант собирается на каждый PR,
      # чтобы ошибка шринкинга (missing class и т.п.) падала в CI, а не при
      # первом релизе. Подпись здесь не требуется: release-workflow отвечает
      # за подписанные сборки (см. .github/workflows/release.yml).
      - name: R8 release smoke (staging, unsigned)
        shell: bash
        run: |
          bash ./gradlew :app:assembleStagingRelease \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      # PAD: debug-бандл тянет 521 МБ модель в install-time пак и проверяет,
      # что пак реально внутри AAB. Единственное автоматическое доказательство
      # wiring'а доставки модели (release-workflow запускается только вручную).
      - name: PAD bundle check (localmodel pack inside AAB)
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:bundleDevDebug \
            --stacktrace --no-daemon --no-parallel --max-workers=2
          AAB=$(find app/build/outputs/bundle -name '*.aab' | head -n 1)
          [ -n "$AAB" ] || { echo "::error::AAB не собран"; exit 1; }
          unzip -l "$AAB" | grep -q 'localmodel/' \
            || { echo "::error::install-time пак localmodel отсутствует в AAB"; exit 1; }
          echo "PAD OK: localmodel pack present in $AAB"

      - name: OMNIX benchmark regression
        shell: bash
        run: |
          bash ./gradlew :app:testDevDebugUnitTest --tests '*BenchmarkRegressionTest*' \
            --stacktrace --no-daemon

      - name: Test OMNIX API server
        shell: bash
        run: |
          bash ./gradlew :server:test :server:jacocoTestCoverageVerification \
            :server:build --stacktrace --no-daemon

      - name: Upload test quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-quality-reports
          path: |
            app/build/reports/jacoco/devDebug/
            app/build/reports/tests/testDevDebugUnitTest/
            app/build/reports/lint-results-devDebug.*
            app/build/reports/detekt/
            ${{ runner.temp }}/lint-gradle.log
            server/build/reports/jacoco/test/
            server/build/reports/tests/test/
            server/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate production TLS and topology
        shell: bash
        run: |
          bash ./deploy/verify-production-config.sh
          docker build --file deploy/server.Dockerfile --tag omnix-server:ci .

      - name: Upload OMNIX APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OMNIX-v0.2-dev.apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-instrumentation:
    name: Android API 34 instrumentation and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 34 instrumentation suite and Android coverage
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4G
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./scripts/run-ci-android-coverage.sh

      - name: Upload instrumentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-api34-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/coverage/
            ${{ runner.temp }}/instrumentation-gradle.log
          if-no-files-found: warn
          retention-days: 30
