# Prometheus scrape для OMNIX API (P1-1).
# Метрики: GET /v1/admin/metrics/prometheus (Bearer-токен admin-клиента обязателен).
#
# Секрет не инлайнится: credentials_file указывает на файл с токеном
# (chmod 600, владелец prometheus). На хосте:
#   echo -n "omx_admin_..." > /etc/prometheus/omnix-token
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: omnix-api
    metrics_path: /v1/admin/metrics/prometheus
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/omnix-token
    static_configs:
      - targets:
          - api.omnix.ai
